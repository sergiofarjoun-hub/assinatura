services:
  hamsa-agent:
    build: .
    container_name: hamsa-agent
    restart: unless-stopped
    # init colhe os zumbis do Chromium e de comandos bash órfãos (node é PID 1 sem isso)
    init: true
    ports:
      - "3010:3010"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MODEL=${MODEL:-claude-opus-4-8}
      - AGENT_PASSWORD=${AGENT_PASSWORD:-}
      - APPROVAL_MODE=${APPROVAL_MODE:-sensitive}
      - CHROME_PATH=${CHROME_PATH:-/usr/bin/chromium}
    volumes:
      - ./workspace:/app/workspace
      - ./sessions:/app/sessions
