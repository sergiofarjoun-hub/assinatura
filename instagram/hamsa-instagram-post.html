<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<meta name="hz:slide-selector" content=".slide">
<title>Hamsa Instagram</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#000}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;
    font-family:'Montserrat',system-ui,sans-serif;color:#e8edf5;
    background:
      radial-gradient(ellipse 62% 36% at 50% 30%, rgba(214,172,94,.32) 0%, rgba(214,172,94,0) 70%),
      radial-gradient(ellipse 90% 55% at 50% 115%, #15284a 0%, rgba(21,40,74,0) 70%),
      linear-gradient(180deg,#060b16 0%,#0b1424 50%,#050912 100%);}
  .rays{position:absolute;inset:0;
    background:repeating-conic-gradient(from -6deg at 50% 30%, rgba(240,210,150,.06) 0deg 1.6deg, transparent 1.6deg 8deg);
    -webkit-mask:radial-gradient(ellipse 70% 60% at 50% 30%,#000 0%,transparent 75%);
    mask:radial-gradient(ellipse 70% 60% at 50% 30%,#000 0%,transparent 75%);}
  .horizon{position:absolute;left:-10%;right:-10%;top:30%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(240,205,140,.7),transparent)}
  .vignette{position:absolute;inset:0;
    background:radial-gradient(ellipse 72% 68% at 50% 50%,transparent 45%,rgba(0,0,0,.78) 100%)}
  .grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
  .bar{position:absolute;left:0;right:0;height:64px;background:#000}
  .bar.top{top:0}.bar.bottom{bottom:0}

  .content{position:absolute;left:90px;right:90px;top:64px;bottom:64px;text-align:center}
  .logo{margin-top:92px}
  .logo img{width:250px;height:auto;filter:drop-shadow(0 0 48px rgba(214,172,94,.45)) drop-shadow(0 24px 40px rgba(0,0,0,.6))}
  .word{margin-top:26px;font-weight:300;font-size:62px;letter-spacing:.38em;text-indent:.38em;color:#ffffff}
  .sub{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:22px;
    font-weight:400;font-size:18px;letter-spacing:.42em;text-indent:.42em;color:#c9a35c}
  .sub::before,.sub::after{content:"";width:70px;height:1px;background:#c9a35c}

  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:84px;line-height:1.05;
    margin:92px 0 0;color:#f3efe6;letter-spacing:-.005em}
  h1 em{font-style:italic;color:#e7d9a0}
  p.lead{font-size:25px;line-height:1.6;color:#9fb0c8;font-weight:400;margin:34px auto 0;max-width:780px}

  .handle{position:absolute;left:0;right:0;bottom:86px}
  .handle .ig{display:inline-flex;align-items:center;gap:18px;padding:18px 40px;border-radius:999px;
    border:1px solid rgba(201,163,92,.55);background:rgba(11,20,36,.55);
    font-weight:500;font-size:32px;letter-spacing:.04em;color:#fff}
  .handle .ig svg{width:34px;height:34px}
  .handle .cta{margin-top:22px;font-size:17px;letter-spacing:.36em;text-indent:.36em;color:#c9a35c;font-weight:500}
  .handle .thanks{margin-top:26px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:27px;color:#7d8ca6}
</style>
</head>
