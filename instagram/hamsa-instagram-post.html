<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080">
<meta name="hz:slide-selector" content=".slide">
<title>Hamsa Instagram</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#000}
  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;color:#f3efe6;
    background:
      radial-gradient(ellipse 70% 45% at 50% 18%, rgba(214,172,94,.38) 0%, rgba(214,172,94,0) 70%),
      radial-gradient(ellipse 90% 60% at 50% 110%, #0d2744 0%, rgba(13,39,68,0) 70%),
      linear-gradient(180deg,#05070c 0%,#0a1322 55%,#030509 100%);}
  /* horizon glow + light rays */
  .horizon{position:absolute;left:-10%;right:-10%;top:22%;height:2px;
    background:linear-gradient(90deg,transparent,rgba(240,205,140,.9),transparent);filter:blur(1px)}
  .rays{position:absolute;inset:0;
    background:repeating-conic-gradient(from -8deg at 50% 22%, rgba(255,225,170,.07) 0deg 2deg, transparent 2deg 9deg);
    -webkit-mask:radial-gradient(ellipse 80% 70% at 50% 22%,#000 0%,transparent 75%);
    mask:radial-gradient(ellipse 80% 70% at 50% 22%,#000 0%,transparent 75%);}
  .fog{position:absolute;inset:0;
    background:radial-gradient(ellipse 60% 25% at 50% 40%,rgba(255,235,200,.10),transparent 70%)}
  .vignette{position:absolute;inset:0;
    background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 45%,rgba(0,0,0,.75) 100%)}
  .grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .9 0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
  .bar{position:absolute;left:0;right:0;height:70px;background:#000}
  .bar.top{top:0}.bar.bottom{bottom:0}

  .content{position:absolute;left:96px;right:96px;top:150px;bottom:130px;text-align:center}
  .kicker{font-size:22px;letter-spacing:.42em;text-transform:uppercase;color:#d6ac5e;font-weight:500}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:112px;line-height:1.0;
    margin:38px 0 0;letter-spacing:-.01em}
  h1 em{font-style:italic;color:#f0cd8c}
  .rule{width:90px;height:1px;background:#d6ac5e;margin:44px auto}
  p.lead{font-size:30px;line-height:1.5;color:#d9d3c6;font-weight:400;margin:0 auto;max-width:800px}
  .pills{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:44px}
  .pill{font-size:19px;letter-spacing:.14em;text-transform:uppercase;padding:14px 26px;
    border:1px solid rgba(214,172,94,.5);border-radius:999px;color:#e9dcc1}
  .handle{position:absolute;left:0;right:0;bottom:70px}
  .handle .at{font-family:'Cormorant Garamond',Georgia,serif;font-size:72px;color:#fff;letter-spacing:.01em}
  .handle .cta{font-size:22px;letter-spacing:.32em;text-transform:uppercase;color:#d6ac5e;margin-top:12px}
  .handle .thanks{font-size:22px;color:#a9a394;margin-top:34px;font-style:italic;
    font-family:'Cormorant Garamond',Georgia,serif;font-size:28px}
</style>
</head>
<body>
<div class="slide">
  <div class="rays"></div><div class="horizon"></div><div class="fog"></div>
  <div class="vignette"></div><div class="grain"></div>
  <div class="bar top"></div><div class="bar bottom"></div>

  <div class="content">
    <div class="kicker">Hamsa Group · Instagram</div>
    <h1>Proteção que<br>acompanha <em>você</em><br>pelo mundo.</h1>
    <div class="rule"></div>
    <p class="lead">Conteúdo sobre proteção internacional, saúde, qualidade de vida e segurança — para você e sua família, onde estiverem.</p>
    <div class="pills">
      <span class="pill">Saúde</span><span class="pill">Vida</span>
      <span class="pill">Segurança</span><span class="pill">Mundo</span>
    </div>
    <div class="handle">
      <div class="at">@hamsa.insurance</div>
      <div class="cta">Siga e compartilhe</div>
      <div class="thanks">Agradecemos o seu apoio.</div>
    </div>
  </div>
</div>
</body>
</html>
